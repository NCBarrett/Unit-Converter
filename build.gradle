buildscript {
    apply plugin: 'hyperskill'
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$hs.kotlin.version"
    }
}

subprojects {
    apply plugin: 'application'
    apply plugin: 'java'
    apply plugin: 'kotlin'
    apply plugin: 'hyperskill'
    apply plugin: 'java-test-fixtures'


//    def userJava = Integer.parseInt(JavaVersion.current().getMajorVersion())
//    def hsJava = Integer.parseInt(hs.kotlin.javaVersion)
//    def testJava = Math.max(userJava, hsJava)
    // Hardcoded to 21 to prevent background system JDK 23 from hijacking the build
    def userJava = 21
    def hsJava = 21
    def testJava = 21
    java.toolchain.languageVersion = JavaLanguageVersion.of(testJava)

    compileJava {
        javaCompiler = javaToolchains.compilerFor {
            languageVersion = JavaLanguageVersion.of(userJava)
        }
    }
    compileTestJava {
        javaCompiler = javaToolchains.compilerFor {
            languageVersion = JavaLanguageVersion.of(testJava)
        }
    }

    repositories {
        mavenCentral()
        maven { url 'https://packages.jetbrains.team/maven/p/hyperskill-hs-test/maven' }
        maven { url 'https://jitpack.io' }
    }

    dependencies {
        // Updated to master-SNAPSHOT to fix Kotlin main method detection bugs
        testImplementation 'com.github.hyperskill:hs-test:master-SNAPSHOT'
    }

    configurations.all {
        resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
    }

    // Fixes the source paths to explicitly look for Kotlin files (.kt)
    sourceSets {
        main {
            kotlin.srcDirs = ['src']
            java.srcDirs = ['src']
        }
        test {
            kotlin.srcDirs = ['test']
            java.srcDirs = ['test']
        }
    }

    test {
        systemProperty "file.encoding", "utf-8"
        outputs.upToDateWhen { false }
    }

    compileJava.options.encoding = 'utf-8'
    tasks.withType(JavaCompile) {
        options.encoding = 'utf-8'
    }
}

project(':util') {
    dependencies {
        implementation 'com.github.hyperskill:hs-test:master-SNAPSHOT'
    }
}

configure(subprojects.findAll {it.name != 'util'}) {
    evaluationDependsOn(':util')
    dependencies {
        // 1. Reference the dependency normally
        implementation project(':util')

        // 2. Safely look up the project folder directly from the root registry
        def utilPath = rootProject.findProject(':util')?.projectDir?.absolutePath
        if (utilPath != null) {
            testImplementation files("$utilPath/build/classes/java/main")
            testImplementation files("$utilPath/build/classes/kotlin/main")
        }

        testImplementation testFixtures(project(':util'))
    }
}

wrapper {
    gradleVersion = hs.gradle.version
}

